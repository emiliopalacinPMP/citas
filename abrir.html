<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>A Tiempo</title>
<link rel="apple-touch-icon" href="icon-panel.png">
<link rel="icon" type="image/png" href="icon-panel.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Tiempo">
<meta name="theme-color" content="#0d7d8c">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,#0d7d8c,#1663a8);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
  .t{font-size:20px;font-weight:800}
  .s{font-size:14px;opacity:.9}
  .spin{width:30px;height:30px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  a.btn{margin-top:8px;display:none;background:#fff;color:#0d7d8c;text-decoration:none;font-weight:800;
    padding:12px 20px;border-radius:12px;font-size:15px}
</style>
</head>
<body>
  <img src="icon-panel.png" alt="A Tiempo">
  <div class="t">A Tiempo</div>
  <div class="s">Abriendo el panel…</div>
  <div class="spin"></div>
  <a id="btn" class="btn" href="#">Toca aquí para abrir</a>
<script>
  var EXEC='https://script.google.com/macros/s/AKfycbwv-d8s-XW1NUeQLr-suunXL4rjPF65BNBFkzbKSyxh0D-Jpmv3leRS_WA_eHZXGjbI/exec';
  var p=new URLSearchParams(location.search);
  var token=(p.get('token')||'').trim();
  var dest=EXEC + (token ? ('?token='+encodeURIComponent(token)) : '');
  var btn=document.getElementById('btn'); btn.href=dest;
  setTimeout(function(){ try{ location.replace(dest); }catch(e){ location.href=dest; } }, 500);
  setTimeout(function(){ btn.style.display='inline-block'; }, 2500);
</script>
</body>
</html>
